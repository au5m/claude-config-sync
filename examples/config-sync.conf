# ~/.claude/config-sync.conf
#
# One line per item. Blank lines and # comments are ignored.
#
# base    A directory your repos live under. List one per machine; the first
#         one that exists wins. Use forward slashes everywhere, including
#         Windows (/c/dev/personal and C:/dev/personal both work in Git Bash).
# repo    A git repo to keep committed and pushed. Relative to base, or absolute.
# live    A file the repo is the source for, and where the live copy lives.
#         Left side is relative to base (or absolute); right side is the live path.
# livedir Same for a whole directory (recursive).
#
# ~ and $HOME are expanded at the start of any path.

base = /c/dev/personal
base = ~/dev/personal

repo = claude-skills
repo = dotfiles

live    = dotfiles/claude/CLAUDE.md      -> ~/.claude/CLAUDE.md
live    = dotfiles/claude/settings.json  -> ~/.claude/settings.json
livedir = dotfiles/claude/agents         -> ~/.claude/agents
